steps:
  # ── Fetch bgutil-pot binary (git-ignored, must be downloaded before build) ──
  - name: 'gcr.io/cloud-builders/curl'
    id: fetch-bgutil
    args:
      - -fsSL
      - 'https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/bgutil-pot-linux-x86_64'
      - -o
      - 'backend/worker/binaries/bgutil-pot'

  # ── Build ──────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-worker
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - --cache-from
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:latest'
      - --cache-from
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:builder'
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:$COMMIT_SHA'
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:latest'
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --target
      - runtime
      - backend/worker
    waitFor: [fetch-bgutil]

  # ── Push builder stage cache (so pip install is cached next run) ───────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-builder-cache
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - --cache-from
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:builder'
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:builder'
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --target
      - builder
      - backend/worker
    waitFor: [fetch-bgutil]

  # ── Push ───────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-worker
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker'
    waitFor: [build-worker, push-builder-cache]

  # ── Deploy to Cloud Run ────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - shortclipr-worker
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:$COMMIT_SHA'
      - '--region'
      - us-central1
      - '--platform'
      - managed
      - '--no-allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '1'
      - '--cpu'
      - '2'
      - '--memory'
      - '4Gi'
      # CRITICAL: allows background work without an active HTTP request
      - '--no-cpu-throttling'
      # Cloud Run max request timeout (job can take up to 60 min)
      - '--timeout'
      - '3600s'
      - '--set-env-vars'
      - >-
        ENVIRONMENT=production,
        GCS_BUCKET_OUTPUT=shortclipr-output-clips,
        REDIS_JOB_QUEUE=shortclipr:jobs,
        BGUTIL_HTTP_SERVER_PORT=4416
      - '--service-account'
      - 'shortclipr-worker@$PROJECT_ID.iam.gserviceaccount.com'
    waitFor: [push-worker]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-worker:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
