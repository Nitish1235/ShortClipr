steps:
  # ── Build ──────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args:
      - build
      - --cache-from
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-frontend:latest'
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-frontend:$COMMIT_SHA'
      - -t
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-frontend:latest'
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      # Note: Next.js requires NEXT_PUBLIC variables during the BUILD step to hardcode them into the HTML/JS.
      # You MUST provide these as substitution variables in the Cloud Build trigger settings!
      - --build-arg
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - --build-arg
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=$_NEXT_PUBLIC_GOOGLE_CLIENT_ID'
      - frontend

  # ── Push ───────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-frontend'
    waitFor: [build-frontend]

  # ── Deploy to Cloud Run ────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - shortclipr-frontend
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-frontend:$COMMIT_SHA'
      - '--region'
      - us-central1
      - '--platform'
      - managed
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--min-instances'
      - '0'     # Scales to 0 to save costs
      - '--max-instances'
      - '20'
      - '--concurrency'
      - '80'    # Next.js Node server can handle high concurrency
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '60s'
      - '--set-env-vars'
      - >-
        NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL,
        NEXT_PUBLIC_GOOGLE_CLIENT_ID=$_NEXT_PUBLIC_GOOGLE_CLIENT_ID
      - '--service-account'
      - 'shortclipr-frontend@$PROJECT_ID.iam.gserviceaccount.com'
    waitFor: [push-frontend]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/shortclipr/shortclipr-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 900s
